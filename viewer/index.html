<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cupcake Worked Example Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <style>
    .font-mono-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .snippet-highlight {
      border-bottom: 2px solid #3b82f6;
      background-color: rgba(59, 130, 246, 0.08);
      cursor: pointer;
      border-radius: 2px;
      padding: 1px 2px;
      transition: all 0.15s ease-in-out;
    }
    .snippet-highlight:hover {
      background-color: rgba(59, 130, 246, 0.2);
    }
    .snippet-highlight.active {
      background-color: rgba(59, 130, 246, 0.25);
      border-bottom: 2px solid #1d4ed8;
      font-weight: 600;
    }
    .explanation-box {
      border-left: 4px solid #3b82f6;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 p-6 sm:p-8">
    <header class="border-b border-gray-100 pb-4 mb-6">
      <div class="flex items-center justify-between mb-2">
        <span id="badge-difficulty" class="text-xs uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700">Novice</span>
        <span id="badge-lang" class="text-xs font-mono text-gray-500 bg-gray-100 px-2 py-0.5 rounded">Python 3</span>
      </div>
      <h1 id="activity-title" class="text-2xl font-bold tracking-tight text-gray-900">Loading activity...</h1>
      <p id="activity-desc" class="text-sm text-gray-500 mt-1"></p>
    </header>

    <!-- Statement -->
    <section class="mb-6">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Statement</h2>
      <div id="statement-content" class="text-sm text-gray-700 leading-relaxed space-y-2"></div>
    </section>

    <!-- Program Code with Annotations -->
    <section class="mb-6">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400">Program</h2>
        <span class="text-[11px] text-blue-600 font-medium">Click highlighted snippets for explanations</span>
      </div>
      <div class="border border-gray-200 rounded-lg overflow-hidden bg-[#fafafa]">
        <div id="code-lines-container" class="font-mono-code text-sm leading-6"></div>
      </div>
    </section>

    <!-- Active Explanation Widget Container -->
    <div id="explanation-modal" class="hidden mb-6 p-4 rounded-lg bg-blue-50/50 border border-blue-100 explanation-box">
      <div class="flex items-start justify-between gap-4 mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-800" id="expl-counter">Explanation 1/1</span>
        <button id="close-expl-btn" class="text-xs bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 px-2.5 py-1 rounded shadow-xs">Close</button>
      </div>
      <div id="expl-body" class="text-sm text-gray-800 leading-relaxed mb-3"></div>
      <div class="flex items-center justify-between pt-2 border-t border-blue-100">
        <button id="prev-expl-btn" class="text-xs font-medium text-blue-700 hover:text-blue-900 disabled:opacity-30 disabled:cursor-not-allowed">← Previous</button>
        <button id="next-expl-btn" class="text-xs font-medium text-blue-700 hover:text-blue-900 disabled:opacity-30 disabled:cursor-not-allowed">Next →</button>
      </div>
    </div>

    <!-- Output Executions -->
    <section class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400">Output</h2>
        <button id="view-mode-toggle" class="text-xs font-semibold text-blue-600 hover:underline uppercase tracking-wider">
          View Split
        </button>
      </div>
      <div id="executions-container" class="space-y-4"></div>
    </section>

    <!-- Footer Meta -->
    <footer class="pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center text-xs text-gray-400 gap-2">
      <div id="footer-authors" class="flex gap-2 items-center"></div>
      <div>Cupcake Activity Viewer</div>
    </footer>
  </div>

  <script>
    let activityData = null;
    let sourceLines = [];
    let currentSnippetIdx = null;
    let currentExplIdx = 0;
    let viewMode = 'console';

    function findSnippetLocation(source, loc) {
      if (!source) return null;
      const { snippet, context, nth = 1 } = loc;
      let searchSpace = source;
      let offset = 0;

      if (context) {
        const contextIdx = source.indexOf(context);
        if (contextIdx === -1) return null;
        searchSpace = context;
        offset = contextIdx;
      }

      let currentIdx = -1;
      for (let i = 0; i < nth; i++) {
        currentIdx = searchSpace.indexOf(snippet, currentIdx + 1);
        if (currentIdx === -1) return null;
      }

      return { start: offset + currentIdx, length: snippet.length };
    }

    async function loadData() {
      try {
        const [yamlResp, pyResp] = await Promise.all([
          fetch('../samples/worked-example.yaml').then(r => r.text()),
          fetch('../samples/main.py').then(r => r.text())
        ]);
        activityData = jsyaml.load(yamlResp);
        sourceLines = pyResp.split('\n');
        renderActivity(activityData, pyResp);
      } catch (err) {
        console.error("Loading sample error:", err);
      }
    }

    function renderActivity(data, sourceCode) {
      document.getElementById('activity-title').textContent = data.title || 'Worked Example';
      document.getElementById('activity-desc').textContent = data.description || '';
      document.getElementById('badge-difficulty').textContent = data.pedagogy?.difficulty || 'Novice';
      document.getElementById('badge-lang').textContent = `${data.runtime?.language || 'Code'} ${data.runtime?.version || ''}`;

      if (data.statement) {
        document.getElementById('statement-content').innerHTML = marked.parse(data.statement);
      }

      renderCode(sourceCode, data.elements || []);
      renderExecutions(data.executions || []);
      renderAuthors(data.authors || [], data.license);
    }

    function renderCode(sourceCode, elements) {
      const container = document.getElementById('code-lines-container');
      container.innerHTML = '';

      const explanations = (elements || []).filter(e => e.type === 'explanation');
      
      const snippetMatches = [];
      explanations.forEach((el, idx) => {
        const pos = findSnippetLocation(sourceCode, el.location);
        if (pos) {
          snippetMatches.push({
            id: idx,
            start: pos.start,
            end: pos.start + pos.length,
            snippet: el.location.snippet,
            explanations: el.explanations
          });
        }
      });

      const lines = sourceCode.split('\n');
      let runningCharIndex = 0;

      lines.forEach((line, lineIdx) => {
        const lineStart = runningCharIndex;
        const lineEnd = runningCharIndex + line.length;
        runningCharIndex += line.length + 1;

        const lineWrapper = document.createElement('div');
        lineWrapper.className = 'flex items-start hover:bg-gray-100/60';

        const lineNum = document.createElement('span');
        lineNum.className = 'w-10 text-right pr-3 text-gray-400 select-none text-xs py-0.5 border-r border-gray-200 bg-gray-50';
        lineNum.textContent = lineIdx + 1;

        const codeContent = document.createElement('span');
        codeContent.className = 'flex-1 pl-3 py-0.5 whitespace-pre overflow-x-auto text-gray-800';

        let lineHtml = escapeHtml(line);
        snippetMatches.forEach(sm => {
          if (sm.start < lineEnd && sm.end > lineStart) {
            const escapedSnippet = escapeHtml(sm.snippet);
            if (lineHtml.includes(escapedSnippet)) {
              lineHtml = lineHtml.replace(
                escapedSnippet,
                `<span class="snippet-highlight" data-snippet-id="${sm.id}">${escapedSnippet}</span>`
              );
            }
          }
        });

        codeContent.innerHTML = lineHtml || '&nbsp;';
        lineWrapper.appendChild(lineNum);
        lineWrapper.appendChild(codeContent);
        container.appendChild(lineWrapper);
      });

      container.querySelectorAll('.snippet-highlight').forEach(el => {
        el.addEventListener('click', (e) => {
          const id = parseInt(el.getAttribute('data-snippet-id'), 10);
          openExplanation(id);
        });
      });
    }

    function openExplanation(snippetIdx) {
      currentSnippetIdx = snippetIdx;
      currentExplIdx = 0;
      updateExplanationUI();
      
      document.querySelectorAll('.snippet-highlight').forEach(el => {
        if (parseInt(el.getAttribute('data-snippet-id'), 10) === snippetIdx) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    function updateExplanationUI() {
      const explModal = document.getElementById('explanation-modal');
      if (currentSnippetIdx === null || !activityData?.elements) {
        explModal.classList.add('hidden');
        return;
      }

      const explanations = activityData.elements.filter(e => e.type === 'explanation');
      const item = explanations[currentSnippetIdx];
      if (!item || !item.explanations?.length) return;

      explModal.classList.remove('hidden');
      const total = item.explanations.length;
      document.getElementById('expl-counter').textContent = `Explanation ${currentExplIdx + 1} of ${total}`;
      
      const currentExpl = item.explanations[currentExplIdx];
      document.getElementById('expl-body').innerHTML = marked.parse(currentExpl.body || '');

      document.getElementById('prev-expl-btn').disabled = currentExplIdx === 0;
      document.getElementById('next-expl-btn').disabled = currentExplIdx === total - 1;
    }

    document.getElementById('close-expl-btn').onclick = () => {
      currentSnippetIdx = null;
      document.querySelectorAll('.snippet-highlight').forEach(el => el.classList.remove('active'));
      document.getElementById('explanation-modal').classList.add('hidden');
    };

    document.getElementById('prev-expl-btn').onclick = () => {
      if (currentExplIdx > 0) {
        currentExplIdx--;
        updateExplanationUI();
      }
    };

    document.getElementById('next-expl-btn').onclick = () => {
      const explanations = activityData.elements.filter(e => e.type === 'explanation');
      const item = explanations[currentSnippetIdx];
      if (currentExplIdx < item.explanations.length - 1) {
        currentExplIdx++;
        updateExplanationUI();
      }
    };

    function renderExecutions(executions) {
      const container = document.getElementById('executions-container');
      container.innerHTML = '';

      executions.forEach(exec => {
        const item = document.createElement('div');
        item.className = 'border border-gray-200 rounded-lg p-3 bg-stone-50';

        const title = document.createElement('div');
        title.className = 'text-xs font-semibold text-gray-700 mb-2';
        title.textContent = exec.title || 'Execution';
        item.appendChild(title);

        if (viewMode === 'console') {
          const pre = document.createElement('pre');
          pre.className = 'font-mono-code text-xs bg-white p-2.5 rounded border border-gray-200 text-gray-800 whitespace-pre-wrap';
          pre.textContent = exec.console || exec.stdout || '<empty>';
          item.appendChild(pre);
        } else {
          const splitDiv = document.createElement('div');
          splitDiv.className = 'space-y-1.5 text-xs font-mono-code';
          if (exec.stdin && exec.stdin.length > 0) {
            splitDiv.innerHTML += `<div class="flex gap-2"><span class="text-gray-400">in:</span><span class="text-gray-700">${escapeHtml(exec.stdin.join('\n'))}</span></div>`;
          }
          if (exec.stdout) {
            splitDiv.innerHTML += `<div class="flex gap-2"><span class="text-gray-400">out:</span><span class="text-gray-700">${escapeHtml(exec.stdout)}</span></div>`;
          }
          if (exec.stderr) {
            splitDiv.innerHTML += `<div class="flex gap-2 text-red-600"><span class="text-red-400">err:</span><span>${escapeHtml(exec.stderr)}</span></div>`;
          }
          item.appendChild(splitDiv);
        }

        container.appendChild(item);
      });
    }

    document.getElementById('view-mode-toggle').onclick = () => {
      viewMode = viewMode === 'console' ? 'split' : 'console';
      document.getElementById('view-mode-toggle').textContent = viewMode === 'console' ? 'View Split' : 'View Console';
      renderExecutions(activityData?.executions || []);
    };

    function renderAuthors(authors, license) {
      const footer = document.getElementById('footer-authors');
      footer.innerHTML = `${license ? license + ' · ' : ''}`;
      authors.forEach((a, i) => {
        const link = `<a href="mailto:${a.email}" class="text-blue-600 hover:underline">${a.first} ${a.last}</a>`;
        footer.innerHTML += (i > 0 ? ' · ' : '') + link;
      });
    }

    function escapeHtml(text) {
      return (text || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
